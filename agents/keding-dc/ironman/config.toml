[discord]
bot_token = "${DISCORD_BOT_TOKEN}"
allowed_channels = ["1515997514904633384"]
trusted_bot_ids = ["1516009402321211493", "1516011372947701911"]
allowed_role_ids = ["1516011177925279747", "1516031769516969995"]
allow_bot_messages = "mentions"
allow_user_messages = "mentions"
max_bot_turns = 100
allowed_users = []
allow_all_channels = false
allow_all_users = true
allow_dm = false

[agent]
command = "kiro-key-wrap"
args = ["acp", "--trust-all-tools"]
working_dir = "/home/agent"
env = {}
inherit_env = ["KEY_POOL_URL", "AGENT_NAME"]

[pool]
max_sessions = 15
session_ttl_hours = 24

[reactions]
enabled = true
remove_after_reply = false
tool_display = "full"

[reactions.emojis]
thinking = "🤖"
tool_use = "🔧"
responding = "✍️"
done = "🆗"
error = "⚠️"
queued = "👀"
cancelled = "🚫"
tool = "🔧"
coding = "💰"
web = "📡"

[reactions.timing]
debounce_ms = 700
stall_soft_ms = 10000
stall_hard_ms = 30000
done_hold_ms = 1500
error_hold_ms = 2500

[reactions.mapping]
